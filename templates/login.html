<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení - Mini Progtest</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 20px; }
        input[type="text"], input[type="password"], button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 15px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #2980b9; }
        .error { color: #e74c3c; margin-top: 15px; font-weight: bold; font-size: 14px; }
        .form-group { text-align: left; margin-bottom: 10px; }
        label { font-weight: bold; font-size: 14px; color: #2c3e50; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Mini Progtest Login</h1>

        <form method="POST">
            <div class="form-group">
                <label for="username">Uživatelské jméno:</label>
                <input type="text" name="username" id="username" placeholder="Napiš svoje jméno..." required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Heslo:</label>
                <input type="password" name="password" id="password" placeholder="Zadej heslo..." required>
            </div>

            <button type="submit">Přihlásit se</button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>

</body>
</html>
